name: Publish

# Publishes to npm for a v<version> tag (see tools/release.mjs). Authenticates through npm Trusted
# Publishing (OIDC, configured on npmjs.com for this workflow), no token; provenance is added automatically.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1; npm 12 needs Node >= 22.22 or 24.15 (Node 20 can't run it).
      # The package itself still runs on Node 20 (engines); only this publishing job needs the newer one.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run check

      - name: Check tag matches package version
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version $V"; exit 1
          fi

      # 0.1.0 was published by hand (a package has to exist before Trusted Publishing can be set up).
      - name: Publish to npm
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "xair-client@$V" version >/dev/null 2>&1; then
            echo "::notice::$V is already on npm, nothing to publish"; exit 0
          fi
          npm publish
